name: Enable Pages HTTPS when certificate is ready

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enable-pages-https.yml"

permissions:
  contents: read
  pages: write

jobs:
  enforce-https:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect certificate and enable HTTPS when eligible
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://api.github.com/repos/${{ github.repository }}/pages
        run: |
          set -euo pipefail
          site="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}")"

          certificate_state="$(jq -r '.https_certificate.state // "pending"' <<<"${site}")"
          https_enforced="$(jq -r '.https_enforced' <<<"${site}")"
          echo "Certificate state: ${certificate_state}"
          echo "HTTPS enforced: ${https_enforced}"

          if [[ "${https_enforced}" == "true" ]]; then
            echo "HTTPS is already enforced."
            exit 0
          fi

          if [[ "${certificate_state}" != "issued" && "${certificate_state}" != "approved" ]]; then
            echo "Certificate is not ready yet; the next scheduled check will retry."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"https_enforced":true}' \
            "${API_URL}"

          echo "HTTPS enforcement enabled."
